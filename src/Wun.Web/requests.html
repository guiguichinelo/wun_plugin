<section id="wun-app" class="wun" data-wun-requests aria-live="polite"></section>
<script>(()=>{const root=document.getElementById('wun-app');function start(){if(!window.ApiClient){setTimeout(start,50);return;}if(!document.querySelector('[data-wun-style]')){const css=document.createElement('link');css.rel='stylesheet';css.href=ApiClient.getUrl('WUN/web/style.css');css.dataset.wunStyle='true';document.head.append(css);}if(window.WunUI){WunUI.mount(root);return;}const script=document.createElement('script');script.src=ApiClient.getUrl('WUN/web/app.js');script.onload=()=>WunUI.mount(root);script.onerror=()=>{root.textContent='Unable to load Requests.'};document.head.append(script);}start();})();</script>
