name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/Wun.Core.Tests/Wun.Core.Tests.csproj -c Release --nologo
      - run: dotnet test tests/Wun.Api.Tests/Wun.Api.Tests.csproj -c Release --nologo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/page_smoke.py
      - run: python tests/header_smoke.py
      - run: python tests/details_smoke.py
      - run: python tests/page_loader_smoke.py
      - run: python tests/locales_smoke.py
      - shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: wun-beta-linux-x64
          path: |
            artifacts/wun-*-linux-x64.zip
            artifacts/wun-*-linux-x64.json
            artifacts/SHA256SUMS.txt
